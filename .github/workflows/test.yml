
name: Run Unit Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      USER_DB: test_user
      PASSWORD: test_pass
      HOST: localhost
      PORT: 5432
      DATABASE: test_plant_diseases
      TEST_DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_plant_diseases

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_plant_diseases
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Installer les dépendances
        run: |
          poetry install --no-root

      - name: Exécuter les tests
        run: |
          PYTHONPATH=$(pwd) poetry run pytest tests/ --cov=app --cov-report=term --maxfail=1 -v

      - name: Afficher le rapport de couverture
        run: |
          poetry run coverage report
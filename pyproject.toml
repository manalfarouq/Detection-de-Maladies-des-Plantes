[tool.poetry]
name = "myvenv"
version = "0.1.0"
description = ""
authors = ["Manal Farouqi <farouqimanal@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.11.14"
pandas = "^2.3.3"
matplotlib = "^3.10.7"
seaborn = "^0.13.2"
scikit-learn = "^1.7.2"
joblib = "^1.5.2"
ipykernel = "^7.1.0"
tensorflow = "^2.20.0"
keras = "^3.12.0"
opencv-python = "^4.12.0.88"
dlib = "^20.0.0"
imutils = "^0.5.4"
fastapi = {extras = ["standard"], version = "^0.121.2"}
uvicorn = "^0.38.0"
sqlalchemy = "^2.0.44"
pydantic = "^2.12.4"
psycopg2-binary = "^2.9.11"
pydantic-settings = "^2.12.0"
python-multipart = "^0.0.20"
python-dotenv = "^1.2.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "httpx (>=0.28.1,<0.29.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "black (>=25.11.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]
